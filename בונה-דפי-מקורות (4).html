loc();res=null;if(schema)st(`<b>${esc(n.heTitle||title)}</b><br><small>בחרו מיקום ולחצו "הצג מקור".</small>`)}})})}

/* ---------- compare / related / find-refs ---------- */
async function netOk(){if(S.ui.net)return true;if(!await confirmD('הפעולה מתחברת לאתר ספריא (sefaria.org). יישלחו אליו רק מראי מקום. להפעיל את החיבור?','הפעלה'))return false;S.ui.net=true;save();return true}
async function sefFetch(ref){const r=await sget(`v3/texts/${encodeURIComponent(ref)}?version=hebrew&return_format=text_only`,`sef.txt.${ref}|he`),d=r.d;if(d.error||!d.versions||!d.versions.length)throw 0;return d}
function addSefSrc(d,cat){const v=d.versions.find(x=>x.language==='he')||d.versions[0],b=mkB('source');b.stype=cat&&cn().includes(cat)?cat:cn()[0];b.ref=d.heRef||d.ref;b.sref=d.ref;b.html=sfl(v.text);b.note=`<i>${esc('ספריא · '+(v.versionTitle||''))}</i>`;cleanB(b);return b}
function insBlocks(bs,afterId){mut(()=>{const d=D(),j=d.blocks.findIndex(z=>z.id===(afterId||S.sel));d.blocks.splice(j<0?d.blocks.length:j+1,0,...bs);S.sel=bs[bs.length-1].id})}
function cmpDlg(){const L=D().blocks.filter(b=>b.type==='source');if(L.length<2)return toast('צריך לפחות שני מקורות בדף');
dlg(`<h2>⚖️ השוואת מקורות</h2><p>בחרו שני מקורות להצגה זה לצד זה:</p>${L.map(b=>`<label class="dr"><span><input type="checkbox" value="${b.id}"> ${esc(b.stype)} ${esc(b.ref)}<small>${esc(plain(b.html).slice(0,60))}</small></span></label>`).join('')}<div class="row"><button class="b" data-x="0">ביטול</button><button class="b pr" data-x="1">יצירת השוואה</button></div>`,(o,c)=>o.addEventListener('click',e=>{const x=X(e);if(x==='0'){c(null);return}if(x!=='1')return;
const ids=$$('input:checked',o).map(i=>i.value);if(ids.length!==2)return toast('יש לבחור בדיוק שני מקורות');
const [p,q]=ids.map(blk),n=mkB('compare'),f=z=>`<b>${esc(z.stype)} ${esc(z.ref)}</b><br>${z.html}`;n.html=f(p);n.html2=f(q);
const d=D();insBlocks([n],d.blocks[Math.max(d.blocks.indexOf(p),d.blocks.indexOf(q))].id);c(1);toast('ההשוואה נוצרה')}))}
const CATMAP={Commentary:'ראשונים',Midrash:'מדרש',Halakhah:'הלכה',Talmud:'תלמוד בבלי',Mishnah:'משנה',Tanakh:'תנ"ך'};
async function relDlg(b0){const id=b0.id,b=blk(id);if(!b||!b.sref)return toast('הכפתור זמין למקורות שנמשכו מספריא');if(!await netOk())return;
dlg(`<h2>🔗 מקורות קשורים – ${esc(b.ref)}</h2><input class="in" id="rq" placeholder="סינון..." aria-label="סינון" style="width:100%"><div id="rl" style="max-height:58vh;overflow:auto;margin-top:6px">טוען…</div><div class="row"><button class="b pr" data-x="close">סגירה</button></div>`,async(o,c)=>{
let links=[];try{links=(await sget('related/'+encodeURIComponent(b.sref),'sef.rel.'+b.sref)).d.links||[]}catch(_){$('#rl',o).textContent='⚠ אין חיבור לספריא.'}
const lr=l=>l.sourceRef||l.ref,draw=()=>{if(!links.length)return;const q=$('#rq',o).value.trim().toLowerCase(),g={};
links.forEach((l,i)=>{if(!lr(l))return;const t=(l.collectiveTitle&&(l.collectiveTitle.he||l.collectiveTitle.en))||l.index_title||'',k=l.category||'אחר';if(q&&!(t+k+lr(l)).toLowerCase().includes(q))return;((g[k]=g[k]||{})[t]=g[k][t]||[]).push(i)});
$('#rl',o).innerHTML=Object.keys(g).map(k=>`<details open><summary><b>${esc(CATMAP[k]||k)}</b> (${Object.values(g[k]).flat().length})</summary>${Object.keys(g[k]).map(t=>`<div style="margin:4px 12px"><b>${esc(t)}</b> ${g[k][t].slice(0,40).map(i=>`<button class="b sm" data-x="a${i}">${esc(links[i].sourceHeRef||lr(links[i]))}</button>`).join(' ')}</div>`).join('')}</details>`).join('')||'לא נמצאו מקורות קשורים.'};
draw();o.addEventListener('input',draw);
o.addEventListener('click',async e=>{const x=X(e);if(x==='close'){c(null);return}if(!/^a\d+$/.test(x))return;const l=links[+x.slice(1)];
try{insBlocks([addSefSrc(await sefFetch(lr(l)),CATMAP[l.category])],id);toast('המקור נוסף לדף')}catch(_){toast('לא ניתן להביא את המקור')}})})}
function findDlg(){dlg(`<h2>🤖 זיהוי מקורות מתוך טקסט</h2><textarea class="in" id="ft" rows="6" style="width:100%" placeholder="הדביקו כאן שיעור או קטע טקסט…" aria-label="טקסט לזיהוי"></textarea><div class="row"><button class="b pr" data-x="find">זהה מקורות</button><button class="b" data-x="close">סגירה</button></div><div id="fres"></div>`,(o,c)=>{let found=[];
o.addEventListener('click',async e=>{const x=X(e);if(x==='close'){c(null);return}
if(x==='find'){const t=$('#ft',o).value.trim();if(!t)return;if(!await confirmD('הטקסט שהדבקתם יישלח לאתר ספריא לצורך הזיהוי. להמשיך?','שליחה'))return;$('#fres',o).textContent='מזהה…';
try{const r=await fetch(SEF+'find-refs',{method:'POST',headers:{'Content-Type':'application/json',accept:'application/json'},body:JSON.stringify({text:{title:'',body:t},lang:'he'})});if(!r.ok)throw 0;const d=await r.json(),rs=(d.body&&d.body.results)||d.results||[],seen=new Set();found=[];
rs.forEach(z=>(z.refs||(z.ref?[z.ref]:[])).forEach(f=>{if(!seen.has(f)){seen.add(f);found.push({ref:f,txt:z.text||''})}}));
$('#fres',o).innerHTML=found.map((f,i)=>`<div class="dr"><div><b dir="ltr">${esc(f.ref)}</b><small>${esc(f.txt)}</small></div><button class="b sm" data-x="a${i}">הוסף את המקור</button></div>`).join('')||'לא זוהו מקורות.'}
catch(_){$('#fres',o).textContent='⚠ הזיהוי נכשל (אין חיבור, או שהדפדפן חסם את הבקשה).'}return}
if(/^a\d+$/.test(x)){const f=found[+x.slice(1)];try{insBlocks([addSefSrc(await sefFetch(f.ref))]);toast('המקור נוסף')}catch(_){toast('לא ניתן להביא את המקור')}}})})}

$('#addg').innerHTML=Object.keys(TY).map(t=>`<button class="b" data-add="${t}">${TY[t][0]} ${TY[t][1]}</button>`).join('');
$('#set').innerHTML=`<h3>עיצוב הדף</h3>
<label class="fld">גופן<select class="in" data-s="font">${O(['Rubik','Assistant','Arial','David',['system-ui','גופן מערכת']])}</select></label>
<label class="fld">גודל<select class="in" data-s="fs">${O([12,14,16,18,20,22,24,28,32])}</select></label>
<label class="fld">רווח שורות<select class="in" data-s="lh">${O([1,1.15,1.3,1.5,1.75,2])}</select></label>
<label class="fld">שוליים<select class="in" data-s="margin">${O([['narrow','צרים'],['normal','רגילים'],['wide','רחבים'],['custom','מותאם אישית']])}</select></label>
<label class="fld">שוליים מותאמים (מ"מ)<input class="in" type="number" min="5" max="50" data-s="mm"></label>
<label class="fld">סגנון<select class="in" data-s="style">${O([['classic','קלאסי'],['torah','תורני'],['modern','מודרני'],['study','לימודי']])}</select></label>
<label class="fld">עמודות<select class="in" data-s="cols">${O([['1','עמודה אחת'],['2','שתי עמודות']])}</select></label><label class="fld">צבע הדגשה<input type="color" data-s="ac" aria-label="צבע הדגשה"></label>
<label class="fld">מספור מקורות<select class="in" data-s="num">${O([['none','ללא מספור'],['1','1, 2, 3'],['א','א, ב, ג'],['א.','א., ב., ג.'],['מקור','מקור 1, מקור 2']])}</select></label>
<label class="fld">כותרת עליונה<input class="in" data-s="head"></label>
<label class="fld">כותרת תחתונה<input class="in" data-s="foot"></label>
<label class="fld"><input type="checkbox" data-s="showTitle"> הצגת שם המסמך בראש הדף</label><label class="fld"><input type="checkbox" data-s="cat"> הצגת קטגוריית המקור בדף</label>
<label class="fld"><input type="checkbox" data-s="pn"> מספרי עמודים בהדפסה</label>
<label class="fld"><input type="checkbox" data-s="color"> הדפסה צבעונית</label>
<h3>תצוגה</h3>
<label class="fld">מצב<select class="in" data-u="mode">${O([['normal','רגיל'],['student','תלמיד – ללא תשובות'],['teacher','מורה']])}</select></label>
<label class="fld">סינון לפי תגית<select class="in" id="tagf" data-u="tag"></select></label>`;
load();initHist();render();
</script>
